<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HydraDL">
<meta name="theme-color" content="#0d0c0a">
<title>NZB CONSOLE</title>

<!-- Favicons & PWA -->
<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0d0c0a;
  --bg-2: #15140f;
  --surface: #1a1813;
  --border: #2a271f;
  --border-soft: #1f1d17;
  --text: #ede8d8;
  --text-dim: #8a857a;
  --text-faint: #555145;
  --accent: #d4f000;
  --accent-dim: #9caa00;
  --danger: #ff5a3a;
  --success: #4ade80;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Geist', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100dvh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  background-image:
    radial-gradient(ellipse at top, rgba(212, 240, 0, 0.04) 0%, transparent 50%),
    repeating-linear-gradient(45deg, transparent 0, transparent 2px, rgba(255,255,255,0.005) 2px, rgba(255,255,255,0.005) 4px);
}

.mono { font-family: 'JetBrains Mono', monospace; }

/* HEADER */
header {
  position: sticky;
  top: 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 14px 18px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 50;
  padding-top: calc(14px + env(safe-area-inset-top));
}

.brand {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.08em;
}
.brand .dot {
  display: inline-block;
  width: 8px; height: 8px;
  background: var(--accent);
  margin-right: 8px;
  vertical-align: 1px;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.icon-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
}
.icon-btn:active { background: var(--surface); color: var(--accent); }

/* SEARCH SECTION */
.search-wrap {
  padding: 18px;
  border-bottom: 1px solid var(--border-soft);
}

.search-wrapper {
  position: relative;
}

.search-box {
  position: relative;
  display: flex;
  align-items: center;
  border: 1px solid var(--border);
  background: var(--bg-2);
}
.search-box::before {
  content: ">";
  font-family: 'JetBrains Mono', monospace;
  color: var(--accent);
  padding: 0 0 0 14px;
  font-weight: 700;
}
.search-box input {
  flex: 1;
  background: transparent;
  border: 0;
  outline: 0;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  padding: 14px 12px;
  min-width: 0;
}
.search-box input::placeholder { color: var(--text-faint); }

/* hide native iOS search clear */
.search-box input::-webkit-search-cancel-button,
.search-box input::-webkit-search-decoration {
  -webkit-appearance: none;
  display: none;
}

.clear-btn {
  display: none;
  background: transparent;
  border: 0;
  color: var(--text-faint);
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  padding: 0 14px;
  height: 100%;
  cursor: pointer;
  flex-shrink: 0;
}
.clear-btn.visible { display: block; }
.clear-btn:active { color: var(--accent); }

/* RECENT SEARCHES DROPDOWN */
.recent-dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--bg-2);
  border: 1px solid var(--border);
  z-index: 40;
  max-height: 50vh;
  overflow-y: auto;
}
.recent-dropdown.open { display: block; }
.recent-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-soft);
  position: sticky;
  top: 0;
  background: var(--bg-2);
}
.recent-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--text-faint);
}
.recent-clear {
  background: transparent;
  border: 0;
  color: var(--danger);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  cursor: pointer;
  padding: 2px 4px;
}
.recent-clear:active { opacity: 0.6; }

.recent-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border-soft);
  cursor: pointer;
  background: transparent;
  border-left: 0;
  border-right: 0;
  width: 100%;
  text-align: left;
}
.recent-item:last-child { border-bottom: 0; }
.recent-item:active { background: var(--surface); }
.recent-item .glyph {
  color: var(--text-faint);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  flex-shrink: 0;
}
.recent-item .text {
  flex: 1;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.recent-item .remove {
  background: transparent;
  border: 0;
  color: var(--text-faint);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  padding: 4px 6px;
  cursor: pointer;
  flex-shrink: 0;
}
.recent-item .remove:active { color: var(--danger); }
.recent-empty {
  padding: 20px 14px;
  text-align: center;
  color: var(--text-faint);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.06em;
}

.chips {
  display: flex;
  gap: 6px;
  margin-top: 12px;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.chips::-webkit-scrollbar { display: none; }

.chip {
  flex-shrink: 0;
  padding: 7px 12px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
}
.chip.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}

/* SORT BAR */
.sortbar {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  overflow-x: auto;
  scrollbar-width: none;
}
.sortbar::-webkit-scrollbar { display: none; }
.sortbar-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-faint);
  letter-spacing: 0.1em;
  font-weight: 700;
  padding-right: 4px;
  flex-shrink: 0;
}
.sort-btn {
  flex-shrink: 0;
  padding: 5px 10px;
  border: 1px solid var(--border-soft);
  background: transparent;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
}
.sort-btn.active {
  background: var(--surface);
  color: var(--accent);
  border-color: var(--accent-dim);
}

/* RESULTS */
.results {
  padding-bottom: 40px;
}

.status-line {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-faint);
  padding: 14px 18px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border-soft);
}
.status-line .accent { color: var(--accent); }
.status-line .err { color: var(--danger); }

.result {
  padding: 16px 18px;
  border-bottom: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}
.result.downloading::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(212, 240, 0, 0.08) 50%, transparent 100%);
  animation: sweep 1.2s linear infinite;
  pointer-events: none;
}
@keyframes sweep {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.result-title {
  font-size: 15px;
  font-weight: 500;
  line-height: 1.35;
  color: var(--text);
  word-break: break-word;
}

.result-meta {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 2px;
}
.meta-cell {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.meta-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.1em;
  color: var(--text-faint);
  font-weight: 700;
}
.meta-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text);
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.meta-value.indexer {
  color: var(--accent-dim);
}

.result-actions {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}

.dl-btn {
  flex: 1;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  padding: 11px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.15s;
}
.dl-btn:active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}
.dl-btn.success {
  background: transparent;
  border-color: var(--success);
  color: var(--success);
}
.dl-btn.error {
  border-color: var(--danger);
  color: var(--danger);
}
.dl-btn:disabled { opacity: 0.5; cursor: default; }

/* EMPTY STATE */
.empty {
  padding: 60px 24px;
  text-align: center;
  color: var(--text-faint);
}
.empty .glyph {
  font-family: 'JetBrains Mono', monospace;
  font-size: 48px;
  color: var(--border);
  margin-bottom: 16px;
  letter-spacing: -0.05em;
}
.empty .msg {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* SETTINGS SHEET */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }

.sheet {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--bg-2);
  border-top: 1px solid var(--accent);
  z-index: 101;
  transform: translateY(100%);
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  padding-bottom: env(safe-area-inset-bottom);
  max-height: 85dvh;
  overflow-y: auto;
}
.sheet.open { transform: translateY(0); }

.sheet-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg-2);
}
.sheet-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
}

.sheet-body { padding: 18px 18px 24px; }

.field { margin-bottom: 18px; }
.field label {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  padding: 12px 14px;
  outline: 0;
}
.field input:focus { border-color: var(--accent); }
.field .hint {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-faint);
  margin-top: 6px;
  letter-spacing: 0.04em;
}

.input-with-toggle {
  display: flex;
  align-items: stretch;
}
.input-with-toggle input {
  flex: 1;
  min-width: 0;
  border-right: 0;
}
.reveal-btn {
  background: var(--bg);
  border: 1px solid var(--border);
  border-left: 1px solid var(--border-soft);
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  padding: 0 12px;
  cursor: pointer;
  flex-shrink: 0;
}
.reveal-btn:active { color: var(--accent); }
.reveal-btn.shown { color: var(--accent); }

.save-btn {
  width: 100%;
  background: var(--accent);
  border: 0;
  color: var(--bg);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.1em;
  padding: 14px;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 8px;
}
.save-btn:active { background: var(--accent-dim); }

/* TOAST */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(120%);
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 18px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.04em;
  z-index: 200;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  bottom: calc(24px + env(safe-area-inset-bottom));
  max-width: calc(100% - 36px);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--success); color: var(--success); }
.toast.error { border-color: var(--danger); color: var(--danger); }

/* SPINNER */
.spinner {
  display: inline-block;
  width: 10px; height: 10px;
  border: 1.5px solid var(--text-faint);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: -1px;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span>NZB CONSOLE</div>
  <button class="icon-btn" id="settingsBtn" aria-label="settings">⚙</button>
</header>

<section class="search-wrap">
  <div class="search-wrapper">
    <form class="search-box" id="searchForm">
      <input type="search" id="searchInput" placeholder="search..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button type="button" class="clear-btn" id="clearBtn" aria-label="clear">✕</button>
    </form>
    <div class="recent-dropdown" id="recentDropdown">
      <div class="recent-header">
        <span class="recent-title">RECENT</span>
        <button type="button" class="recent-clear" id="recentClear">CLEAR ALL</button>
      </div>
      <div class="recent-list" id="recentList"></div>
    </div>
  </div>
  <div class="chips" id="chips">
    <button class="chip active" data-cat="search" data-label="ALL">ALL</button>
    <button class="chip" data-cat="book" data-label="BOOKS">BOOKS</button>
    <button class="chip" data-cat="tvsearch" data-label="TV">TV</button>
    <button class="chip" data-cat="movie" data-label="MOVIES">MOVIES</button>
    <button class="chip" data-cat="music" data-label="MUSIC">MUSIC</button>
  </div>
  <div class="sortbar" id="sortbar">
    <span class="sortbar-label">SORT</span>
    <button class="sort-btn active" data-sort="relevance">RELEVANCE</button>
    <button class="sort-btn" data-sort="size">SIZE ↓</button>
    <button class="sort-btn" data-sort="age">NEWEST</button>
    <button class="sort-btn" data-sort="grabs">GRABS ↓</button>
  </div>
</section>

<section class="results" id="results">
  <div class="empty">
    <div class="glyph">[ ]</div>
    <div class="msg">awaiting query</div>
  </div>
</section>

<!-- SETTINGS SHEET -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<aside class="sheet" id="sheet">
  <div class="sheet-header">
    <div class="sheet-title">// CONFIG</div>
    <button class="icon-btn" id="closeSheet" aria-label="close">✕</button>
  </div>
  <div class="sheet-body">
    <div class="field">
      <label>NZBHydra URL</label>
      <input type="url" id="hydraUrl" placeholder="https://your-nzbhydra.example.com">
      <div class="hint">no trailing slash</div>
    </div>
    <div class="field">
      <label>NZBHydra API Key</label>
      <div class="input-with-toggle">
        <input type="password" id="hydraKey" placeholder="abc123...">
        <button type="button" class="reveal-btn" data-target="hydraKey" aria-label="show/hide">SHOW</button>
      </div>
      <div class="hint">config → authorization → api key</div>
    </div>
    <div class="field">
      <label>Torbox API Key</label>
      <div class="input-with-toggle">
        <input type="password" id="torboxKey" placeholder="tk-...">
        <button type="button" class="reveal-btn" data-target="torboxKey" aria-label="show/hide">SHOW</button>
      </div>
      <div class="hint">torbox.app → settings → api</div>
    </div>
    <div class="field">
      <label>Result Limit</label>
      <input type="number" id="resultLimit" placeholder="50" min="10" max="200">
      <div class="hint">how many to fetch per indexer</div>
    </div>
    <button class="save-btn" id="saveSettings">SAVE</button>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

const state = {
  category: 'search',
  sort: 'relevance',
  lastResults: [],
  hydraUrl: '',
  hydraKey: '',
  torboxKey: '',
  resultLimit: 50,
  searching: false,
};

// ---- STORAGE ----
function loadSettings() {
  try {
    state.hydraUrl = localStorage.getItem('hydraUrl') || '';
    state.hydraKey = localStorage.getItem('hydraKey') || '';
    state.torboxKey = localStorage.getItem('torboxKey') || '';
    state.resultLimit = parseInt(localStorage.getItem('resultLimit') || '50', 10);
  } catch (e) { /* private mode */ }
  $('#hydraUrl').value = state.hydraUrl;
  $('#hydraKey').value = state.hydraKey;
  $('#torboxKey').value = state.torboxKey;
  $('#resultLimit').value = state.resultLimit;
}

function saveSettings() {
  state.hydraUrl = $('#hydraUrl').value.trim().replace(/\/+$/, '');
  state.hydraKey = $('#hydraKey').value.trim();
  state.torboxKey = $('#torboxKey').value.trim();
  state.resultLimit = parseInt($('#resultLimit').value, 10) || 50;
  try {
    localStorage.setItem('hydraUrl', state.hydraUrl);
    localStorage.setItem('hydraKey', state.hydraKey);
    localStorage.setItem('torboxKey', state.torboxKey);
    localStorage.setItem('resultLimit', String(state.resultLimit));
  } catch (e) {}
  closeSheet();
  toast('config saved', 'success');
}

// ---- SHEET ----
function openSheet() {
  $('#sheetBackdrop').classList.add('open');
  $('#sheet').classList.add('open');
}
function closeSheet() {
  $('#sheetBackdrop').classList.remove('open');
  $('#sheet').classList.remove('open');
  // re-hide any revealed API keys
  document.querySelectorAll('.reveal-btn').forEach(btn => {
    const input = document.getElementById(btn.dataset.target);
    if (input && input.type === 'text') {
      input.type = 'password';
      btn.textContent = 'SHOW';
      btn.classList.remove('shown');
    }
  });
}

// ---- TOAST ----
let toastTimer;
function toast(msg, type = '') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ---- SEARCH ----
async function search(query) {
  if (!state.hydraUrl || !state.hydraKey) {
    toast('configure NZBHydra first', 'error');
    openSheet();
    return;
  }
  if (!query.trim()) return;

  state.searching = true;
  renderStatus(`querying indexers...`, 'pending');

  const url = `${state.hydraUrl}/api?apikey=${encodeURIComponent(state.hydraKey)}&t=${state.category}&q=${encodeURIComponent(query)}&extended=1&limit=${state.resultLimit}`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const items = parseNewznab(text);
    renderResults(items);
  } catch (err) {
    console.error(err);
    renderStatus(`error: ${err.message}`, 'err');
    if (String(err.message).includes('Failed to fetch')) {
      toast('CORS or network error - check settings', 'error');
    }
  } finally {
    state.searching = false;
  }
}

function parseNewznab(xmlText) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, 'text/xml');
  const items = [...doc.querySelectorAll('item')];
  return items.map(item => {
    const attrs = {};
    item.querySelectorAll('attr, *|attr').forEach(a => {
      const name = a.getAttribute('name');
      const value = a.getAttribute('value');
      if (name) attrs[name] = value;
    });
    // also try namespaced attr lookup
    const nzbAttrs = item.getElementsByTagNameNS('*', 'attr');
    for (const a of nzbAttrs) {
      const name = a.getAttribute('name');
      const value = a.getAttribute('value');
      if (name && !attrs[name]) attrs[name] = value;
    }
    return {
      title: item.querySelector('title')?.textContent || 'untitled',
      link: item.querySelector('link')?.textContent || '',
      guid: item.querySelector('guid')?.textContent || '',
      pubDate: item.querySelector('pubDate')?.textContent || '',
      size: parseInt(attrs.size || '0', 10),
      indexer: attrs.hydraIndexerName || attrs.hydraindexername || attrs.indexer || attrs.nzbhydraindexer || '?',
      category: attrs.category || '',
      grabs: parseInt(attrs.grabs || '0', 10),
    };
  });
}

function fmtSize(bytes) {
  if (!bytes) return '?';
  const units = ['B','KB','MB','GB','TB'];
  let i = 0;
  while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
  return `${bytes.toFixed(bytes < 10 ? 1 : 0)}${units[i]}`;
}

function fmtAge(dateStr) {
  if (!dateStr) return '?';
  const d = new Date(dateStr);
  const days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (days < 1) return 'today';
  if (days < 30) return `${days}d`;
  if (days < 365) return `${Math.floor(days/30)}mo`;
  return `${Math.floor(days/365)}y`;
}

// ---- RENDER ----
function renderStatus(text, cls = '') {
  $('#results').innerHTML = `
    <div class="status-line">
      <span class="${cls === 'pending' ? 'accent' : cls === 'err' ? 'err' : ''}">${text}</span>
    </div>`;
}

function renderResults(items) {
  const container = $('#results');
  state.lastResults = items; // store for re-sorting without re-fetching
  const sorted = sortResults(items, state.sort);
  if (!sorted.length) {
    container.innerHTML = `<div class="empty"><div class="glyph">∅</div><div class="msg">no results</div></div>`;
    return;
  }
  const status = `<div class="status-line"><span class="accent">${sorted.length}</span> result${sorted.length === 1 ? '' : 's'}</div>`;
  const rows = sorted.map((it, i) => `
    <div class="result" data-i="${i}">
      <div class="result-title">${escapeHtml(it.title)}</div>
      <div class="result-meta">
        <div class="meta-cell"><div class="meta-label">SOURCE</div><div class="meta-value indexer">${escapeHtml(it.indexer)}</div></div>
        <div class="meta-cell"><div class="meta-label">SIZE</div><div class="meta-value">${fmtSize(it.size)}</div></div>
        <div class="meta-cell"><div class="meta-label">AGE</div><div class="meta-value">${fmtAge(it.pubDate)}</div></div>
        <div class="meta-cell"><div class="meta-label">GRABS</div><div class="meta-value">${it.grabs || 0}</div></div>
      </div>
      <div class="result-actions">
        <button class="dl-btn" data-link="${escapeAttr(it.link)}" data-title="${escapeAttr(it.title)}">→ TORBOX</button>
      </div>
    </div>
  `).join('');
  container.innerHTML = status + rows;

  container.querySelectorAll('.dl-btn').forEach(btn => {
    btn.addEventListener('click', () => sendToTorbox(btn));
  });
}

function sortResults(items, mode) {
  const arr = [...items];
  switch (mode) {
    case 'size':
      arr.sort((a, b) => (b.size || 0) - (a.size || 0));
      break;
    case 'age':
      arr.sort((a, b) => new Date(b.pubDate).getTime() - new Date(a.pubDate).getTime());
      break;
    case 'grabs':
      arr.sort((a, b) => (b.grabs || 0) - (a.grabs || 0));
      break;
    case 'relevance':
    default:
      // leave as-is (server-side order)
      break;
  }
  return arr;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function escapeAttr(s) { return escapeHtml(s); }

// ---- TORBOX ----
async function sendToTorbox(btn) {
  if (!state.torboxKey) {
    toast('add torbox api key first', 'error');
    openSheet();
    return;
  }
  const link = btn.dataset.link;
  if (!link) { toast('no link', 'error'); return; }

  const original = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>SENDING';
  btn.closest('.result').classList.add('downloading');

  try {
    const formData = new FormData();
    formData.append('link', link);

    const res = await fetch(`${state.hydraUrl}/torbox/v1/api/usenet/createusenetdownload`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${state.torboxKey}` },
      body: formData,
    });

    // Read as text first so we can show useful debug info if it's not JSON
    const rawText = await res.text();
    let data = null;
    try { data = JSON.parse(rawText); } catch (e) { /* not JSON */ }

    btn.closest('.result').classList.remove('downloading');

    if (data && data.success) {
      btn.textContent = '✓ QUEUED';
      btn.className = 'dl-btn success';
      toast('sent to torbox', 'success');
    } else if (data) {
      btn.textContent = '✕ FAILED';
      btn.className = 'dl-btn error';
      toast(`torbox: ${data.detail || data.error || 'unknown error'}`, 'error');
      setTimeout(() => { btn.textContent = original; btn.className = 'dl-btn'; btn.disabled = false; }, 4000);
    } else {
      // Non-JSON response — show first bit of body so we can see what happened
      btn.textContent = '✕ FAILED';
      btn.className = 'dl-btn error';
      const snippet = (rawText || '').replace(/\s+/g, ' ').trim().slice(0, 200) || `HTTP ${res.status}`;
      toast(`bad response: ${snippet}`, 'error');
      console.error('Torbox non-JSON response:', res.status, rawText);
      setTimeout(() => { btn.textContent = original; btn.className = 'dl-btn'; btn.disabled = false; }, 6000);
    }
  } catch (err) {
    btn.closest('.result').classList.remove('downloading');
    btn.textContent = '✕ ERROR';
    btn.className = 'dl-btn error';
    toast(`network: ${err.message}`, 'error');
    setTimeout(() => { btn.textContent = original; btn.className = 'dl-btn'; btn.disabled = false; }, 4000);
  }
}

// ---- RECENT SEARCHES ----
const RECENT_KEY = 'recentSearches';
const RECENT_MAX = 10;

function getRecent() {
  try {
    const raw = localStorage.getItem(RECENT_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function setRecent(arr) {
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(arr)); } catch (e) {}
}
function addRecent(query) {
  const q = query.trim();
  if (!q) return;
  let recent = getRecent().filter(item => item.q !== q);
  recent.unshift({ q, cat: state.category, t: Date.now() });
  if (recent.length > RECENT_MAX) recent = recent.slice(0, RECENT_MAX);
  setRecent(recent);
}
function removeRecent(query) {
  setRecent(getRecent().filter(item => item.q !== query));
}
function clearRecent() {
  setRecent([]);
  renderRecent();
}
function renderRecent() {
  const list = $('#recentList');
  const recent = getRecent();
  if (!recent.length) {
    list.innerHTML = `<div class="recent-empty">no recent searches</div>`;
    return;
  }
  list.innerHTML = recent.map(item => `
    <button class="recent-item" data-q="${escapeAttr(item.q)}" data-cat="${escapeAttr(item.cat || 'search')}">
      <span class="glyph">↻</span>
      <span class="text">${escapeHtml(item.q)}</span>
      <span class="remove" data-remove="${escapeAttr(item.q)}">✕</span>
    </button>
  `).join('');
}
function openRecent() {
  renderRecent();
  $('#recentDropdown').classList.add('open');
}
function closeRecent() {
  $('#recentDropdown').classList.remove('open');
}
function updateClearBtn() {
  const hasText = $('#searchInput').value.length > 0;
  $('#clearBtn').classList.toggle('visible', hasText);
}

// ---- EVENTS ----
$('#settingsBtn').addEventListener('click', openSheet);
$('#closeSheet').addEventListener('click', closeSheet);
$('#sheetBackdrop').addEventListener('click', closeSheet);
$('#saveSettings').addEventListener('click', saveSettings);

// API key reveal toggles
document.querySelectorAll('.reveal-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.target);
    if (!input) return;
    const isPwd = input.type === 'password';
    input.type = isPwd ? 'text' : 'password';
    btn.textContent = isPwd ? 'HIDE' : 'SHOW';
    btn.classList.toggle('shown', isPwd);
  });
});

$('#searchForm').addEventListener('submit', (e) => {
  e.preventDefault();
  $('#searchInput').blur();
  closeRecent();
  const q = $('#searchInput').value.trim();
  if (q) addRecent(q);
  search($('#searchInput').value);
});

$('#searchInput').addEventListener('input', updateClearBtn);

$('#searchInput').addEventListener('focus', () => {
  // show recent dropdown if input is empty
  if (!$('#searchInput').value.trim() && getRecent().length) {
    openRecent();
  }
});

$('#clearBtn').addEventListener('click', () => {
  $('#searchInput').value = '';
  updateClearBtn();
  $('#searchInput').focus();
  if (getRecent().length) openRecent();
});

$('#recentClear').addEventListener('click', (e) => {
  e.stopPropagation();
  clearRecent();
});

$('#recentList').addEventListener('click', (e) => {
  // handle remove (X) button
  const removeBtn = e.target.closest('[data-remove]');
  if (removeBtn) {
    e.stopPropagation();
    removeRecent(removeBtn.dataset.remove);
    renderRecent();
    return;
  }
  // handle item tap (re-run search)
  const item = e.target.closest('.recent-item');
  if (!item) return;
  const q = item.dataset.q;
  const cat = item.dataset.cat;
  $('#searchInput').value = q;
  updateClearBtn();
  // set category chip if it differs
  if (cat && cat !== state.category) {
    state.category = cat;
    $$('.chip').forEach(c => c.classList.toggle('active', c.dataset.cat === cat));
  }
  closeRecent();
  $('#searchInput').blur();
  addRecent(q);
  search(q);
});

// close recent dropdown when tapping outside
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrapper')) {
    closeRecent();
  }
});

$('#chips').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  $$('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  state.category = chip.dataset.cat;
  const q = $('#searchInput').value.trim();
  if (q) search(q);
});

$('#sortbar').addEventListener('click', (e) => {
  const btn = e.target.closest('.sort-btn');
  if (!btn) return;
  $$('.sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.sort = btn.dataset.sort;
  // re-render in place without re-fetching
  if (state.lastResults && state.lastResults.length) {
    renderResults(state.lastResults);
  }
});

// ---- INIT ----
loadSettings();
if (!state.hydraUrl || !state.hydraKey) {
  setTimeout(() => openSheet(), 400);
}
</script>
