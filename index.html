<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HydraDL">
<meta name="theme-color" content="#0d0c0a">
<title>NZBHydra2 Download Console</title>

<!-- Favicons & PWA -->
<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0d0c0a;
  --bg-2: #15140f;
  --surface: #1a1813;
  --border: #2a271f;
  --border-soft: #1f1d17;
  --text: #ede8d8;
  --text-dim: #8a857a;
  --text-faint: #555145;
  --accent: #d4f000;
  --accent-dim: #9caa00;
  --danger: #ff5a3a;
  --success: #4ade80;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Geist', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100dvh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  background-image:
    radial-gradient(ellipse at top, rgba(212, 240, 0, 0.04) 0%, transparent 50%),
    repeating-linear-gradient(45deg, transparent 0, transparent 2px, rgba(255,255,255,0.005) 2px, rgba(255,255,255,0.005) 4px);
}

.mono { font-family: 'JetBrains Mono', monospace; }

/* HEADER */
header {
  position: sticky;
  top: 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 14px 18px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 50;
  padding-top: calc(14px + env(safe-area-inset-top));
}

.brand {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.08em;
}
.brand .dot {
  display: inline-block;
  width: 8px; height: 8px;
  background: var(--accent);
  margin-right: 8px;
  vertical-align: 1px;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.icon-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
}
.icon-btn:active { background: var(--surface); color: var(--accent); }

/* SEARCH SECTION */
.search-wrap {
  padding: 18px;
  border-bottom: 1px solid var(--border-soft);
}

.search-box {
  position: relative;
  display: flex;
  align-items: center;
  border: 1px solid var(--border);
  background: var(--bg-2);
}
.search-box::before {
  content: ">";
  font-family: 'JetBrains Mono', monospace;
  color: var(--accent);
  padding: 0 0 0 14px;
  font-weight: 700;
}
.search-box input {
  flex: 1;
  background: transparent;
  border: 0;
  outline: 0;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  padding: 14px 12px;
}
.search-box input::placeholder { color: var(--text-faint); }

.chips {
  display: flex;
  gap: 6px;
  margin-top: 12px;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.chips::-webkit-scrollbar { display: none; }

.chip {
  flex-shrink: 0;
  padding: 7px 12px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
}
.chip.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}

/* RESULTS */
.results {
  padding-bottom: 40px;
}

.status-line {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-faint);
  padding: 14px 18px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border-soft);
}
.status-line .accent { color: var(--accent); }
.status-line .err { color: var(--danger); }

.result {
  padding: 16px 18px;
  border-bottom: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}
.result.downloading::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(212, 240, 0, 0.08) 50%, transparent 100%);
  animation: sweep 1.2s linear infinite;
  pointer-events: none;
}
@keyframes sweep {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.result-title {
  font-size: 15px;
  font-weight: 500;
  line-height: 1.35;
  color: var(--text);
  word-break: break-word;
}

.result-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.03em;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.result-meta .sep { color: var(--text-faint); }
.result-meta .indexer { color: var(--accent-dim); }

.result-actions {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}

.dl-btn {
  flex: 1;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  padding: 11px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.15s;
}
.dl-btn:active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}
.dl-btn.success {
  background: transparent;
  border-color: var(--success);
  color: var(--success);
}
.dl-btn.error {
  border-color: var(--danger);
  color: var(--danger);
}
.dl-btn:disabled { opacity: 0.5; cursor: default; }

/* EMPTY STATE */
.empty {
  padding: 60px 24px;
  text-align: center;
  color: var(--text-faint);
}
.empty .glyph {
  font-family: 'JetBrains Mono', monospace;
  font-size: 48px;
  color: var(--border);
  margin-bottom: 16px;
  letter-spacing: -0.05em;
}
.empty .msg {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* SETTINGS SHEET */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }

.sheet {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--bg-2);
  border-top: 1px solid var(--accent);
  z-index: 101;
  transform: translateY(100%);
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  padding-bottom: env(safe-area-inset-bottom);
  max-height: 85dvh;
  overflow-y: auto;
}
.sheet.open { transform: translateY(0); }

.sheet-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg-2);
}
.sheet-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
}

.sheet-body { padding: 18px 18px 24px; }

.field { margin-bottom: 18px; }
.field label {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  padding: 12px 14px;
  outline: 0;
}
.field input:focus { border-color: var(--accent); }
.field .hint {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-faint);
  margin-top: 6px;
  letter-spacing: 0.04em;
}

.save-btn {
  width: 100%;
  background: var(--accent);
  border: 0;
  color: var(--bg);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.1em;
  padding: 14px;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 8px;
}
.save-btn:active { background: var(--accent-dim); }

/* TOAST */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(120%);
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 18px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.04em;
  z-index: 200;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  bottom: calc(24px + env(safe-area-inset-bottom));
  max-width: calc(100% - 36px);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--success); color: var(--success); }
.toast.error { border-color: var(--danger); color: var(--danger); }

/* SPINNER */
.spinner {
  display: inline-block;
  width: 10px; height: 10px;
  border: 1.5px solid var(--text-faint);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: -1px;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span>NZB CONSOLE</div>
  <button class="icon-btn" id="settingsBtn" aria-label="settings">⚙</button>
</header>

<section class="search-wrap">
  <form class="search-box" id="searchForm">
    <input type="search" id="searchInput" placeholder="search..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  </form>
  <div class="chips" id="chips">
    <button class="chip active" data-cat="search" data-label="ALL">ALL</button>
    <button class="chip" data-cat="book" data-label="BOOKS">BOOKS</button>
    <button class="chip" data-cat="tvsearch" data-label="TV">TV</button>
    <button class="chip" data-cat="movie" data-label="MOVIES">MOVIES</button>
    <button class="chip" data-cat="music" data-label="MUSIC">MUSIC</button>
  </div>
</section>

<section class="results" id="results">
  <div class="empty">
    <div class="glyph">[ ]</div>
    <div class="msg">awaiting query</div>
  </div>
</section>

<!-- SETTINGS SHEET -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<aside class="sheet" id="sheet">
  <div class="sheet-header">
    <div class="sheet-title">// CONFIG</div>
    <button class="icon-btn" id="closeSheet" aria-label="close">✕</button>
  </div>
  <div class="sheet-body">
    <div class="field">
      <label>NZBHydra URL</label>
      <input type="url" id="hydraUrl" placeholder="https://your-nzbhydra.example.com">
      <div class="hint">no trailing slash</div>
    </div>
    <div class="field">
      <label>NZBHydra API Key</label>
      <input type="text" id="hydraKey" placeholder="abc123...">
      <div class="hint">config → authorization → api key</div>
    </div>
    <div class="field">
      <label>Torbox API Key</label>
      <input type="text" id="torboxKey" placeholder="tk-...">
      <div class="hint">torbox.app → settings → api</div>
    </div>
    <div class="field">
      <label>Result Limit</label>
      <input type="number" id="resultLimit" placeholder="50" min="10" max="200">
      <div class="hint">how many to fetch per indexer</div>
    </div>
    <button class="save-btn" id="saveSettings">SAVE</button>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

const state = {
  category: 'search',
  hydraUrl: '',
  hydraKey: '',
  torboxKey: '',
  resultLimit: 50,
  searching: false,
};

// ---- STORAGE ----
function loadSettings() {
  try {
    state.hydraUrl = localStorage.getItem('hydraUrl') || '';
    state.hydraKey = localStorage.getItem('hydraKey') || '';
    state.torboxKey = localStorage.getItem('torboxKey') || '';
    state.resultLimit = parseInt(localStorage.getItem('resultLimit') || '50', 10);
  } catch (e) { /* private mode */ }
  $('#hydraUrl').value = state.hydraUrl;
  $('#hydraKey').value = state.hydraKey;
  $('#torboxKey').value = state.torboxKey;
  $('#resultLimit').value = state.resultLimit;
}

function saveSettings() {
  state.hydraUrl = $('#hydraUrl').value.trim().replace(/\/+$/, '');
  state.hydraKey = $('#hydraKey').value.trim();
  state.torboxKey = $('#torboxKey').value.trim();
  state.resultLimit = parseInt($('#resultLimit').value, 10) || 50;
  try {
    localStorage.setItem('hydraUrl', state.hydraUrl);
    localStorage.setItem('hydraKey', state.hydraKey);
    localStorage.setItem('torboxKey', state.torboxKey);
    localStorage.setItem('resultLimit', String(state.resultLimit));
  } catch (e) {}
  closeSheet();
  toast('config saved', 'success');
}

// ---- SHEET ----
function openSheet() {
  $('#sheetBackdrop').classList.add('open');
  $('#sheet').classList.add('open');
}
function closeSheet() {
  $('#sheetBackdrop').classList.remove('open');
  $('#sheet').classList.remove('open');
}

// ---- TOAST ----
let toastTimer;
function toast(msg, type = '') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ---- SEARCH ----
async function search(query) {
  if (!state.hydraUrl || !state.hydraKey) {
    toast('configure NZBHydra first', 'error');
    openSheet();
    return;
  }
  if (!query.trim()) return;

  state.searching = true;
  renderStatus(`querying indexers...`, 'pending');

  const url = `${state.hydraUrl}/api?apikey=${encodeURIComponent(state.hydraKey)}&t=${state.category}&q=${encodeURIComponent(query)}&extended=1&limit=${state.resultLimit}`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const items = parseNewznab(text);
    renderResults(items);
  } catch (err) {
    console.error(err);
    renderStatus(`error: ${err.message}`, 'err');
    if (String(err.message).includes('Failed to fetch')) {
      toast('CORS or network error - check settings', 'error');
    }
  } finally {
    state.searching = false;
  }
}

function parseNewznab(xmlText) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, 'text/xml');
  const items = [...doc.querySelectorAll('item')];
  return items.map(item => {
    const attrs = {};
    item.querySelectorAll('attr, *|attr').forEach(a => {
      const name = a.getAttribute('name');
      const value = a.getAttribute('value');
      if (name) attrs[name] = value;
    });
    // also try namespaced attr lookup
    const nzbAttrs = item.getElementsByTagNameNS('*', 'attr');
    for (const a of nzbAttrs) {
      const name = a.getAttribute('name');
      const value = a.getAttribute('value');
      if (name && !attrs[name]) attrs[name] = value;
    }
    return {
      title: item.querySelector('title')?.textContent || 'untitled',
      link: item.querySelector('link')?.textContent || '',
      guid: item.querySelector('guid')?.textContent || '',
      pubDate: item.querySelector('pubDate')?.textContent || '',
      size: parseInt(attrs.size || '0', 10),
      indexer: attrs.indexer || attrs.nzbhydraindexer || '?',
      category: attrs.category || '',
      grabs: attrs.grabs || '0',
    };
  });
}

function fmtSize(bytes) {
  if (!bytes) return '?';
  const units = ['B','KB','MB','GB','TB'];
  let i = 0;
  while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
  return `${bytes.toFixed(bytes < 10 ? 1 : 0)}${units[i]}`;
}

function fmtAge(dateStr) {
  if (!dateStr) return '?';
  const d = new Date(dateStr);
  const days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (days < 1) return 'today';
  if (days < 30) return `${days}d`;
  if (days < 365) return `${Math.floor(days/30)}mo`;
  return `${Math.floor(days/365)}y`;
}

// ---- RENDER ----
function renderStatus(text, cls = '') {
  $('#results').innerHTML = `
    <div class="status-line">
      <span class="${cls === 'pending' ? 'accent' : cls === 'err' ? 'err' : ''}">${text}</span>
    </div>`;
}

function renderResults(items) {
  const container = $('#results');
  if (!items.length) {
    container.innerHTML = `<div class="empty"><div class="glyph">∅</div><div class="msg">no results</div></div>`;
    return;
  }
  const status = `<div class="status-line"><span class="accent">${items.length}</span> result${items.length === 1 ? '' : 's'}</div>`;
  const rows = items.map((it, i) => `
    <div class="result" data-i="${i}">
      <div class="result-title">${escapeHtml(it.title)}</div>
      <div class="result-meta">
        <span class="indexer">${escapeHtml(it.indexer)}</span>
        <span class="sep">·</span>
        <span>${fmtSize(it.size)}</span>
        <span class="sep">·</span>
        <span>${fmtAge(it.pubDate)}</span>
        ${it.grabs && it.grabs !== '0' ? `<span class="sep">·</span><span>${it.grabs}↓</span>` : ''}
      </div>
      <div class="result-actions">
        <button class="dl-btn" data-link="${escapeAttr(it.link)}" data-title="${escapeAttr(it.title)}">→ TORBOX</button>
      </div>
    </div>
  `).join('');
  container.innerHTML = status + rows;

  container.querySelectorAll('.dl-btn').forEach(btn => {
    btn.addEventListener('click', () => sendToTorbox(btn));
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function escapeAttr(s) { return escapeHtml(s); }

// ---- TORBOX ----
async function sendToTorbox(btn) {
  if (!state.torboxKey) {
    toast('add torbox api key first', 'error');
    openSheet();
    return;
  }
  const link = btn.dataset.link;
  if (!link) { toast('no link', 'error'); return; }

  const original = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>SENDING';
  btn.closest('.result').classList.add('downloading');

  try {
    const formData = new FormData();
    formData.append('link', link);

    const res = await fetch('https://api.torbox.app/v1/api/usenet/createusenetdownload', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${state.torboxKey}` },
      body: formData,
    });

    const data = await res.json();
    btn.closest('.result').classList.remove('downloading');

    if (data.success) {
      btn.textContent = '✓ QUEUED';
      btn.className = 'dl-btn success';
      toast('sent to torbox', 'success');
    } else {
      btn.textContent = '✕ FAILED';
      btn.className = 'dl-btn error';
      toast(`torbox: ${data.detail || data.error || 'unknown error'}`, 'error');
      setTimeout(() => { btn.textContent = original; btn.className = 'dl-btn'; btn.disabled = false; }, 4000);
    }
  } catch (err) {
    btn.closest('.result').classList.remove('downloading');
    btn.textContent = '✕ ERROR';
    btn.className = 'dl-btn error';
    toast(`network: ${err.message}`, 'error');
    setTimeout(() => { btn.textContent = original; btn.className = 'dl-btn'; btn.disabled = false; }, 4000);
  }
}

// ---- EVENTS ----
$('#settingsBtn').addEventListener('click', openSheet);
$('#closeSheet').addEventListener('click', closeSheet);
$('#sheetBackdrop').addEventListener('click', closeSheet);
$('#saveSettings').addEventListener('click', saveSettings);

$('#searchForm').addEventListener('submit', (e) => {
  e.preventDefault();
  $('#searchInput').blur();
  search($('#searchInput').value);
});

$('#chips').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  $$('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  state.category = chip.dataset.cat;
  const q = $('#searchInput').value.trim();
  if (q) search(q);
});

// ---- INIT ----
loadSettings();
if (!state.hydraUrl || !state.hydraKey) {
  setTimeout(() => openSheet(), 400);
}
</script>
</body>
</html>
